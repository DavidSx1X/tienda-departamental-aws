# Nginx en el EC2 "gateway" (subred pública). Es el ÚNICO punto expuesto a internet (puerto 80).
# Reenvía cada prefijo a la IP privada del servicio dueño de esa ruta.
upstream catalogo { server 10.0.2.10:3001; }
upstream carrito  { server 10.0.2.20:3002; }
upstream ordenes  { server 10.0.2.30:3003; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Si un servicio no responde (caído o lento), Nginx corta y devuelve un 503 controlado.
    # Los errores que el propio servicio genere (409, 404, 503 con su JSON) pasan tal cual.
    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    error_page 502 503 504 = @servicio_no_disponible;

    location /api/catalogo/ { proxy_pass http://catalogo/; }
    location /api/carrito/  { proxy_pass http://carrito/; }
    location /api/ordenes/  { proxy_pass http://ordenes/; }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","servicio":"gateway"}';
    }

    location @servicio_no_disponible {
        default_type application/json;
        return 503 '{"error":{"codigo":"SERVICIO_NO_DISPONIBLE","mensaje":"El servicio no respondió a tiempo. Intente de nuevo."}}';
    }
}
