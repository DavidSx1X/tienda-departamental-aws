# EC2 "carrito" (subred privada) — Redis (carrito y sesiones) + servicio de carrito
services:
  redis:
    image: redis:7-alpine
    container_name: carrito-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis/redis-carrito.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Se habilita en la Entrega 2 (código en ./app)
  # api:
  #   build: ./app
  #   container_name: carrito-api
  #   restart: unless-stopped
  #   env_file: .env
  #   ports: ["3002:3002"]

volumes:
  redisdata:
