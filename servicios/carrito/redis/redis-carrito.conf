# Redis del CARRITO y SESIONES. Es la base de datos principal de este servicio:
# no debe perder carritos al reiniciar el contenedor.
bind 0.0.0.0
protected-mode yes
port 6379
maxmemory 128mb
# nunca expulsa carritos: si se llena, rechaza escrituras (error controlado)
maxmemory-policy noeviction
# AOF: cada escritura queda en disco
appendonly yes
# a lo más se pierde 1 s ante una caída
appendfsync everysec
# además, snapshot RDB cada 5 min si hubo 10 cambios
save 300 10
