# Redis de CACHÉ del catálogo (cache-aside). Datos desechables:
# si se pierden, el servicio los vuelve a leer de MongoDB.
bind 0.0.0.0
protected-mode yes
port 6379
# La contraseña se inyecta desde .env con --requirepass (ver docker-compose.yml)
maxmemory 64mb
# al llenarse, expulsa lo menos usado
maxmemory-policy allkeys-lru
# sin persistencia: es sólo caché
save ""
appendonly no
