# EC2 "catalogo" (subred privada) — MongoDB + Redis de caché + servicio de catálogo
services:
  mongo:
    image: mongo:7
    container_name: catalogo-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: catalogo
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
      - ./db/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: catalogo-redis-cache
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_CACHE_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_CACHE_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}

  # Se habilita en la Entrega 2 (código en ./app)
  # api:
  #   build: ./app
  #   container_name: catalogo-api
  #   restart: unless-stopped
  #   env_file: .env
  #   ports: ["3001:3001"]

volumes:
  mongodata:
